name: Build book and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.5/pandoc-3.5-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
      - name: Review gate (branding, secrets, chapter structure)
        run: python3 scripts/check_book.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU examples and tests
        if: hashFiles('examples/**/*.py') != ''
        run: |
          set -euo pipefail
          python3 -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q -r requirements-examples.txt
          python3 -m pip check
          python3 -m pytest -q tests
          python3 scripts/draw_ch01.py
          git diff --exit-code -- assets/images/
      - name: Build HTML + EPUB
        run: python3 build.py
      - name: Validate embedded assets and chapter code
        run: python3 scripts/check_built_book.py
      - name: Validate EPUB
        run: |
          set -euo pipefail
          sudo apt-get install -y -q epubcheck >/dev/null
          epubcheck dist/posttrain-from-zero.epub
      - name: Upload EPUB (for review)
        uses: actions/upload-artifact@v4
        with:
          name: epub
          path: dist/posttrain-from-zero.epub
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
