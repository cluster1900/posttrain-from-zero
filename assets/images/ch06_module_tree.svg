<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img">
<title>微型文本模型：冻结组件与 12 类 LoRA 目标</title>
<rect width="1200" height="580" fill="#f7f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52657e"/></marker></defs>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#18243b">
<text x="40" y="40" dy="0.35em" font-size="27" text-anchor="start" fill="#18243b" font-weight="bold">微型文本模型：冻结组件与 12 类 LoRA 目标</text>
<rect x="40" y="85" width="1120" height="65" rx="10" fill="#e8edf4" stroke="#a0b2cd"/>
<text x="600" y="117" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">embedding（冻结）→ 两层骨干 → norm（冻结）→ 共享 lm_head（冻结）</text>
<rect x="40" y="205" width="350" height="225" rx="10" fill="#e5f3ee" stroke="#a0b2cd"/>
<text x="215" y="242" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">全注意力：4 类</text>
<text x="215" y="295" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">q_proj   k_proj</text>
<text x="215" y="338" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">v_proj   o_proj</text>
<rect x="420" y="205" width="350" height="225" rx="10" fill="#e5f3ee" stroke="#a0b2cd"/>
<text x="595" y="242" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">GDN：5 类</text>
<text x="595" y="295" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">in_proj_qkv   in_proj_z</text>
<text x="595" y="338" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">in_proj_a   in_proj_b</text>
<text x="595" y="381" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">out_proj</text>
<rect x="800" y="205" width="350" height="225" rx="10" fill="#e5f3ee" stroke="#a0b2cd"/>
<text x="975" y="242" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">每层 MLP：3 类</text>
<text x="975" y="295" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">gate_proj</text>
<text x="975" y="338" dy="0.35em" font-size="21" text-anchor="middle" fill="#18243b" font-weight="normal">up_proj   down_proj</text>
<text x="40" y="483" dy="0.35em" font-size="21" text-anchor="start" fill="#18243b" font-weight="normal">绿色表示安装 LoRA 的投影类别；绿色框中的基座权重仍冻结，只训练 A/B 增量。</text>
<text x="40" y="530" dy="0.35em" font-size="21" text-anchor="start" fill="#18243b" font-weight="normal">12 是叶名称类别数。两层 MLP 重复出现，本章微型模型实际命中 15 个实例。</text>
</g></svg>
