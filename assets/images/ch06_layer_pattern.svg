<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
<title>层类型的 3∶1 排列，不是参数量或耗时比例</title>
<rect width="1200" height="330" fill="#f7f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52657e"/></marker></defs>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#18243b">
<text x="40" y="40" dy="0.35em" font-size="27" text-anchor="start" fill="#18243b" font-weight="bold">层类型的 3∶1 排列，不是参数量或耗时比例</text>
<rect x="45" y="105" width="225" height="95" rx="10" fill="#e5f3ee" stroke="#a0b2cd"/>
<text x="157" y="151" dy="0.35em" font-size="24" text-anchor="middle" fill="#18243b" font-weight="normal">线性注意力</text>
<path d="M275 151 H327" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="105" width="225" height="95" rx="10" fill="#e5f3ee" stroke="#a0b2cd"/>
<text x="452" y="151" dy="0.35em" font-size="24" text-anchor="middle" fill="#18243b" font-weight="normal">线性注意力</text>
<path d="M570 151 H622" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="635" y="105" width="225" height="95" rx="10" fill="#e5f3ee" stroke="#a0b2cd"/>
<text x="747" y="151" dy="0.35em" font-size="24" text-anchor="middle" fill="#18243b" font-weight="normal">线性注意力</text>
<path d="M865 151 H917" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="930" y="105" width="225" height="95" rx="10" fill="#e6edfa" stroke="#a0b2cd"/>
<text x="1042" y="151" dy="0.35em" font-size="24" text-anchor="middle" fill="#18243b" font-weight="normal">全注意力</text>
<text x="45" y="248" dy="0.35em" font-size="20" text-anchor="start" fill="#18243b" font-weight="normal">源项目架构示意：重复的层类型组合；不在这里断言完整模型总层数。</text>
<text x="45" y="286" dy="0.35em" font-size="20" text-anchor="start" fill="#18243b" font-weight="normal">本章 CPU fixture：仅 1 层线性 + 1 层全注意力，不能套用真实规模统计。</text>
</g></svg>
