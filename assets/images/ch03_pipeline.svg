<text x="159.0" y="176" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">权重确实被加载</text>
<path d="M284 165 H318" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="330" y="110" width="246" height="111" rx="10" fill="#fff1ed" stroke="#a0b2cd"/>
<text x="453.0" y="140" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">固定回答</text>
<text x="453.0" y="176" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">dummy_response</text>
<path d="M578 165 H612" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="624" y="110" width="246" height="111" rx="10" fill="#fff1ed" stroke="#a0b2cd"/>
<text x="747.0" y="140" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">打印奖励</text>
<text x="747.0" y="176" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">没有损失与反传</text>
<path d="M872 165 H906" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="918" y="110" width="246" height="111" rx="10" fill="#fff1ed" stroke="#a0b2cd"/>
<text x="1041.0" y="140" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">保存完成产物</text>
<text x="1041.0" y="176" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">不能证明发生了学习</text>
<rect x="36" y="290" width="246" height="111" rx="10" fill="#e9f5f2" stroke="#a0b2cd"/>
