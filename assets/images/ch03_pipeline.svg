<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" fill="#18243b">
<text x="36" y="38" dy="0.35em" font-size="27" text-anchor="start" font-weight="bold" fill="#18243b">从占位流程到可追踪的更新链路</text>
<text x="36" y="87" dy="0.35em" font-size="22" text-anchor="start" font-weight="bold" fill="#a34234">v1：有流程外观，缺少学习链路</text>
<text x="36" y="263" dy="0.35em" font-size="22" text-anchor="start" font-weight="bold" fill="#087f83">v2：输出、奖励、概率与参数更新必须接通</text>
<rect x="36" y="110" width="246" height="111" rx="10" fill="#fff1ed" stroke="#a0b2cd"/>
