<text x="159.0" y="356" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">保存行为 logprob</text>
<path d="M284 345 H318" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="330" y="290" width="246" height="111" rx="10" fill="#e9f5f2" stroke="#a0b2cd"/>
<text x="453.0" y="320" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">沙箱与验证器</text>
<text x="453.0" y="356" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">真实结果奖励</text>
<path d="M578 345 H612" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="624" y="290" width="246" height="111" rx="10" fill="#e9f5f2" stroke="#a0b2cd"/>
<text x="747.0" y="320" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">DPPO 与反传</text>
<text x="747.0" y="356" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">更新 LoRA 参数</text>
<path d="M872 345 H906" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="918" y="290" width="246" height="111" rx="10" fill="#e9f5f2" stroke="#a0b2cd"/>
<text x="1041.0" y="320" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">重新同步与评测</text>
<text x="1041.0" y="356" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">检验链路与效果</text>
<text x="36" y="444" dy="0.35em" font-size="19" text-anchor="start" font-weight="normal" fill="#18243b">结构示意。v2 代码具备链路，不代表当时已经完成 GPU、真实沙箱或模型质量验收。</text>
