<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img">
<title>平台路线演进：把方案、探针和训练分开</title>
<rect width="1200" height="310" fill="#f7f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52657e"/></marker></defs>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#18243b">
<text x="40" y="40" dy="0.35em" font-size="27" text-anchor="start" fill="#18243b" font-weight="bold">平台路线演进：把方案、探针和训练分开</text>
<rect x="40" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="162" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">直接虚拟机方案</text>
<text x="162" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">第三轮未创建机器</text>
<text x="162" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">不能填入实际训练时长</text>
<path d="M287 157 H323" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="332" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="454" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">GPU 作业探针</text>
<text x="454" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">第四轮小模型通过</text>
<text x="454" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">嵌套容器能力失败</text>
<path d="M579 157 H615" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="624" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="746" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">本地平台适配</text>
<text x="746" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">第六、七轮改代码</text>
<text x="746" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">没有新建云资源</text>
<path d="M871 157 H907" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="916" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="1038" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">镜像与远程容器</text>
<text x="1038" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">第八轮构建及导入</text>
<text x="1038" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">第九轮原任务链路</text>
<text x="40" y="270" dy="0.35em" font-size="18" text-anchor="start" fill="#18243b" font-weight="normal">历史结构示意，非耗时比例。Colab 的正式 SFT 是另一条已完成的运行链路。</text>
</g></svg>
