<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img">
<title>验证结论必须停留在证据覆盖的层级</title>
<rect width="1200" height="405" fill="#f7f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52657e"/></marker></defs>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" fill="#18243b">
<text x="36" y="38" dy="0.35em" font-size="27" text-anchor="start" font-weight="bold" fill="#18243b">验证结论必须停留在证据覆盖的层级</text>
<rect x="36" y="112" width="246" height="146" rx="10" fill="#ffffff" stroke="#a0b2cd"/>
<text x="159.0" y="142" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">静态审核</text>
<text x="159.0" y="178" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">代码路径与接口</text>
<text x="159.0" y="206" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">不能证明路径被执行</text>
<path d="M284 185 H318" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="330" y="112" width="246" height="146" rx="10" fill="#ffffff" stroke="#a0b2cd"/>
<text x="453.0" y="142" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">CPU 单元测试</text>
<text x="453.0" y="178" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">受控输入与边界</text>
<text x="453.0" y="206" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">不能证明 GPU 兼容</text>
<path d="M578 185 H612" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="624" y="112" width="246" height="146" rx="10" fill="#ffffff" stroke="#a0b2cd"/>
<text x="747.0" y="142" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">目标环境冒烟</text>
<text x="747.0" y="178" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">真实生成与沙箱</text>
<text x="747.0" y="206" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">不能证明质量提升</text>
<path d="M872 185 H906" fill="none" stroke="#52657e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="918" y="112" width="246" height="146" rx="10" fill="#ffffff" stroke="#a0b2cd"/>
<text x="1041.0" y="142" dy="0.35em" font-size="22" text-anchor="middle" font-weight="bold" fill="#18243b">正式质量评测</text>
<text x="1041.0" y="178" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">同任务集、完整日志</text>
<text x="1041.0" y="206" dy="0.35em" font-size="18" text-anchor="middle" font-weight="normal" fill="#18243b">再判断效果与门禁</text>
<text x="36" y="306" dy="0.35em" font-size="21" text-anchor="start" font-weight="normal" fill="#18243b">PR #1 的已验范围：73 项 CPU 测试，以及编译、Shell 语法、空白检查。</text>
<text x="36" y="349" dy="0.35em" font-size="19" text-anchor="start" font-weight="normal" fill="#18243b">其 GPU / vLLM / Harbor 验证明确待完成；本图不按测试数量推算模型能力。</text>
</g></svg>
