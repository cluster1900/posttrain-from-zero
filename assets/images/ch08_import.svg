<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img">
<title>跨环境导入：资产完整、运行可用和质量通过是不同门禁</title>
<rect width="1200" height="310" fill="#f7f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52657e"/></marker></defs>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#18243b">
<text x="40" y="40" dy="0.35em" font-size="27" text-anchor="start" fill="#18243b" font-weight="bold">跨环境导入：资产完整、运行可用和质量通过是不同门禁</text>
<rect x="40" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="162" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">冻结来源</text>
<text x="162" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">模型与数据版本</text>
<text x="162" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">原配置、adapter、日志</text>
<path d="M287 157 H323" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="332" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="454" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">逐项字节核验</text>
<text x="454" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">文件清单与 SHA-256</text>
<text x="454" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">不改写旧交接记录</text>
<path d="M579 157 H615" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="624" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="746" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">语义合同匹配</text>
<text x="746" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">基座与 LoRA 兼容</text>
<text x="746" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">独立生成导入记录</text>
<path d="M871 157 H907" fill="none" stroke="#52657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="916" y="95" width="244" height="125" rx="10" fill="white" stroke="#a0b2cd"/>
<text x="1038" y="125" dy="0.35em" font-size="22" text-anchor="middle" fill="#18243b" font-weight="bold">后续仍须验收</text>
<text x="1038" y="162" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">目标 GPU 上实际运行</text>
<text x="1038" y="189" dy="0.35em" font-size="17" text-anchor="middle" fill="#18243b" font-weight="normal">质量报告不能由导入代替</text>
<text x="40" y="270" dy="0.35em" font-size="18" text-anchor="start" fill="#18243b" font-weight="normal">流程示意。round8 从固定 Git 对象恢复历史配置原字节，不以放松哈希检查绕过差异。</text>
</g></svg>
