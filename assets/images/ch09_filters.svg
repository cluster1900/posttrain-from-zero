<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240"><title>第9章样本过滤位置</title><desc>基础设施错误、零方差与截断在不同阶段处理。</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="15" text-anchor="middle"><rect x="25" y="75" width="200" height="65" fill="#ffebee" stroke="#c62828"/><text x="125" y="103">基础设施错误</text><text x="125" y="125">奖励前移除</text><rect x="260" y="75" width="200" height="65" fill="#fff8e1" stroke="#f9a825"/><text x="360" y="103">零方差组</text><text x="360" y="125">中心化后过滤</text><rect x="495" y="75" width="200" height="65" fill="#e8f5e9" stroke="#2e7d32"/><text x="595" y="103">截断轨迹</text><text x="595" y="125">留在均值、禁梯度</text></g></svg>